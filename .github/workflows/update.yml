name: 更新免费 LLM API 状态

# 每 8 小时跑一次（UTC 时间），也可在 Actions 页面手动触发
on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: '只检测指定平台（密钥变量名，逗号分隔；留空表示全部）'
        required: false
        default: ''

# 需要写权限才能把结果 commit 回仓库
permissions:
  contents: write

# 同一时间只跑一个，避免两次提交互相覆盖
concurrency:
  group: update-free-llm-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行检测脚本
        # 脚本只用标准库，无需 pip install
        # 未配置的 Secret 会解析成空字符串，对应平台自动标记为「未配置密钥」并跳过
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
          MOONSHOT_KEY: ${{ secrets.MOONSHOT_KEY }}
          DASHSCOPE_KEY: ${{ secrets.DASHSCOPE_KEY }}
          SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
          MODELSCOPE_KEY: ${{ secrets.MODELSCOPE_KEY }}
          HUNYUAN_KEY: ${{ secrets.HUNYUAN_KEY }}
          QIANFAN_KEY: ${{ secrets.QIANFAN_KEY }}
          VOLC_ARK_KEY: ${{ secrets.VOLC_ARK_KEY }}
          SPARK_KEY: ${{ secrets.SPARK_KEY }}
          MINIMAX_KEY: ${{ secrets.MINIMAX_KEY }}
          STEPFUN_KEY: ${{ secrets.STEPFUN_KEY }}
          YI_KEY: ${{ secrets.YI_KEY }}
          BAICHUAN_KEY: ${{ secrets.BAICHUAN_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          TOGETHER_KEY: ${{ secrets.TOGETHER_KEY }}
          NVIDIA_KEY: ${{ secrets.NVIDIA_KEY }}
          SAMBANOVA_KEY: ${{ secrets.SAMBANOVA_KEY }}
          HYPERBOLIC_KEY: ${{ secrets.HYPERBOLIC_KEY }}
          NEBIUS_KEY: ${{ secrets.NEBIUS_KEY }}
          NOVITA_KEY: ${{ secrets.NOVITA_KEY }}
          CHUTES_KEY: ${{ secrets.CHUTES_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python update_list.py \
            --only "${{ github.event.inputs.only }}" \
            --cron "0 */8 * * *"

      - name: 提交并推送更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 保证产出文件都存在，避免 pathspec 报错
          touch README.md free_llm_api.csv status.json history.jsonl uptime.jsonl

          git add -- README.md free_llm_api.csv status.json history.jsonl uptime.jsonl models.auto.json sources.json

          if git diff --cached --quiet; then
            echo "本次没有变化，跳过提交。"
            exit 0
          fi

          git commit -m "chore: 自动更新免费 API 状态 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
